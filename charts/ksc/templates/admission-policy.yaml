# Defence in depth: even if the dispatcher has a bug (or someone applies a pod by hand), the
# cluster refuses pods in the sandbox namespace that break the guarantees. Pod Security Admission
# (restricted) covers privilege, host access and capabilities; this policy adds what PSA does not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ksc-sandbox-pod-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, has(c.securityContext) &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true))
      message: "every container must set securityContext.readOnlyRootFilesystem: true"
      reason: Forbidden
    - expression: >-
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: "pods must set automountServiceAccountToken: false"
      reason: Forbidden
    - expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits && 'ephemeral-storage' in c.resources.limits)
      message: "every container must set cpu, memory and ephemeral-storage limits"
      reason: Forbidden
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.configMap) || has(v.emptyDir))
      message: "only configMap and emptyDir volumes are allowed"
      reason: Forbidden
    - expression: >-
        object.spec.containers.all(c, {{ .Values.sandbox.allowedImagePrefixes | toJson }}.exists(p, c.image.startsWith(p)))
      message: "container images must come from the allowed registries ({{ join ", " .Values.sandbox.allowedImagePrefixes }})"
      reason: Forbidden
    - expression: >-
        !has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0
      message: "ephemeral containers (kubectl debug) are not allowed in the sandbox namespace"
      reason: Forbidden
    {{- range $k, $v := .Values.sandbox.nodeSelector }}
    - expression: >-
        has(object.spec.nodeSelector) && '{{ $k }}' in object.spec.nodeSelector && object.spec.nodeSelector['{{ $k }}'] == '{{ $v }}'
      message: "pods must select the sandbox node pool ({{ $k }}={{ $v }}); they may not run next to the trusted components"
      reason: Forbidden
    {{- end }}
    {{- if .Values.sandbox.runtimeClassName }}
    - expression: >-
        has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '{{ .Values.sandbox.runtimeClassName }}'
      message: "pods must use the {{ .Values.sandbox.runtimeClassName }} runtime class"
      reason: Forbidden
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ksc-sandbox-pod-guardrails
spec:
  policyName: ksc-sandbox-pod-guardrails
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.sandboxNamespace }}
