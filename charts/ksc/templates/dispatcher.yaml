{{- $secret := ternary "ksc-postgres" .Values.postgres.externalUrlSecret .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksc-dispatcher
  namespace: {{ .Values.systemNamespace }}
  labels: {{- include "ksc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.dispatcher.replicas }}
  {{- end }}
  selector:
    matchLabels: {app: ksc-dispatcher}
  template:
    metadata:
      labels: {app: ksc-dispatcher}
    spec:
      serviceAccountName: ksc-dispatcher   # token is needed here: it talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dispatcher
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "dispatcher.main"]
          envFrom: [{secretRef: {name: {{ $secret }}}}]
          ports: [{containerPort: 9100, name: metrics}]
          env:
            - {name: SANDBOX_NAMESPACE, value: {{ .Values.sandboxNamespace | quote }}}
            - {name: CONCURRENCY_CAP, value: {{ .Values.concurrencyCap | quote }}}
            - {name: RUNNER_IMAGE_PYTHON, value: {{ .Values.image.runnerPython | quote }}}
            - {name: KNOWN_NODES, value: {{ join "," .Values.knownNodes | quote }}}
            - {name: SANDBOX_NODE_SELECTOR, value: {{ .Values.sandbox.nodeSelector | toJson | quote }}}
            - {name: SANDBOX_TOLERATIONS, value: {{ .Values.sandbox.tolerations | toJson | quote }}}
            - {name: SANDBOX_RUNTIME_CLASS, value: {{ .Values.sandbox.runtimeClassName | quote }}}
            - {name: DB_CONNECT_TIMEOUT, value: {{ .Values.db.connectTimeoutSeconds | quote }}}
            - {name: LOG_RETENTION_DAYS, value: {{ .Values.logRetentionDays | quote }}}
            - {name: RUNNER_IMAGE_NODE, value: {{ .Values.image.runnerNode | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ksc-dispatcher-metrics
  namespace: {{ .Values.systemNamespace }}
  labels: {app: ksc-dispatcher}
spec:
  clusterIP: None
  selector: {app: ksc-dispatcher}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
