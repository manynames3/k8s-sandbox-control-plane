systemNamespace: ksc-system
sandboxNamespace: sandboxes

# Max concurrent sandboxes. ResourceQuota pod count equals this.
concurrencyCap: 4

image:
  api: ksc/api:dev
  runnerPython: ksc/runner-python:dev
  runnerNode: ksc/runner-node:dev
  pullPolicy: IfNotPresent

dispatcher:
  replicas: 1

# KEDA scales dispatcher replicas on queued-run count (needs KEDA installed first).
keda:
  enabled: false
  maxReplicas: 3
  queuedPerReplica: 4     # one more dispatcher per this many queued runs
  pollingInterval: 5
  cooldownPeriod: 30
  scaleDownStabilizationSeconds: 30

# ServiceMonitor, PrometheusRule and Grafana dashboard (needs kube-prometheus-stack installed first).
monitoring:
  enabled: false
  alerts:
    queueWaitP95Seconds: 30
    infraErrorRatio: 0.01

# Worker node names, shown in the UI's cluster panel even while idle (make up fills this in).
knownNodes: []

# Output chunks of finished runs are deleted after this many days (keeps the database small).
logRetentionDays: 7

db:
  # Fail fast on kind so /readyz reports an outage quickly; Neon needs longer to wake from suspension.
  connectTimeoutSeconds: 3

postgres:
  enabled: true            # in-cluster Postgres (local/CI). Off on EKS (Neon).
  image: postgres:16-alpine
  storage: 1Gi
  # externalUrlSecret: name of an existing Secret with key DATABASE_URL when enabled=false
  externalUrlSecret: ""

sandbox:
  defaultCpu: 500m
  defaultMemory: 512Mi
  maxMemory: 512Mi
  maxCpu: 500m
  ephemeralStorage: 128Mi
  # Where sandboxes may run (EKS: the tainted sandbox node group). Empty on kind.
  nodeSelector: {}
  tolerations: []
  # Images a pod in the sandbox namespace may use (prefix match). The dispatcher's images are built from this repo.
  allowedImagePrefixes: ["ksc/"]
  # RuntimeClass for sandbox pods (e.g. gvisor). Empty = the node default (runc).
  runtimeClassName: ""
  # Optional egress allowlist (CIDRs). Empty = fully denied. 169.254.0.0/16 is always excluded.
  egressAllowCidrs: []

# External database (Neon) egress for the trusted namespace, used when postgres.enabled is false.
# Only these TCP ports, and never to private or link-local ranges.
externalDb:
  egressPorts: [5432]

# Kubernetes API server egress for the trusted namespace (kind: control-plane container IP).
apiServerCidr: 0.0.0.0/0
apiServerPorts: [6443, 443]
