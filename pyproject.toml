[project]
name = "ksc"
version = "0.1.0"
description = "k8s-sandbox-control-plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "kubernetes>=31",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom
[tool.mypy]
strict = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = ["e2e: needs the kind cluster (make up)", "attack: hostile-code suite, needs the kind cluster", "chaos: kills components, needs the kind cluster"]

# The kubernetes client ships loose types (everything Optional); this one thin wrapper is the only user.
[[tool.mypy.overrides]]
module = "dispatcher.kube"
disable_error_code = ["union-attr", "arg-type", "no-untyped-call"]
