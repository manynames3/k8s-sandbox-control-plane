# Lean kube-prometheus-stack for the kind demo (Colima VM has 8 GB). Used by `make monitoring`.
defaultRules: {create: false}
alertmanager: {enabled: false}
nodeExporter: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
prometheusOperator:
  admissionWebhooks: {enabled: false}
  tls: {enabled: false}
  resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 128Mi}}
prometheus:
  prometheusSpec:
    retention: 6h
    # pick up our ServiceMonitors and PrometheusRule without a release label
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}
grafana:
  adminPassword: admin          # local demo only; Grafana is reached through kubectl port-forward
  resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 256Mi}}
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard, searchNamespace: ALL}
kube-state-metrics:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
