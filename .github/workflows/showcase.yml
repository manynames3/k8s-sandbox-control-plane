name: showcase
# Builds the public replay site (static files only: recorded runs, no API, cannot execute code) and,
# once the owner has configured Cloudflare, deploys it. Deploy needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the repository variable SHOWCASE_DEPLOY=true.
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/snapshot_lib.py", "bench/results/**", ".github/workflows/showcase.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.162.0

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the replay site
        run: VITE_MODE=replay npm run build
      - name: The site must be static, offline-safe and free of identifiers
        run: |
          test -s dist/snapshot.json
          if grep -rEl "127\.0\.0\.1:8080|ksc-worker|ksc-control-plane|ksc_[A-Za-z0-9_-]{20,}" dist; then
            echo "dist contains an API address, node name or key"; exit 1
          fi
          if grep -Eq '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' dist/snapshot.json; then
            echo "snapshot contains a UUID"; exit 1
          fi
          echo "dist ok: $(du -sk dist | cut -f1) kB"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-site
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.SHOWCASE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: replay-site
          path: web/dist
      - name: Deploy (Workers static assets)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
