name: images
# Multi-arch images on GHCR (free for public images; no ECR). The Mac is arm64 and the EKS nodes are
# amd64, so every image is built for both. After the FIRST run, make each package public (GitHub >
# Packages > package settings > Change visibility), otherwise EKS nodes cannot pull them anonymously.
on:
  push:
    # Every push to main, not only image changes: the EKS session pulls images tagged with the exact commit it runs on
    # (sha-<commit>), so each commit needs them. Unchanged layers come from the cache, so this is cheap.
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ksc-api, file: Dockerfile.api}
          - {name: ksc-runner-python, file: runner/Dockerfile.python}
          - {name: ksc-runner-node, file: runner/Dockerfile.node}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
