name: eks-session
# Creates an ephemeral EKS cluster, runs the proof (guarantees, e2e, attack, chaos, benchmark), commits the
# results and destroys everything. THIS SPENDS MONEY (about $0.25 per hour). It runs only when the owner
# starts it by hand, inside a GitHub Environment that requires the owner's approval, and it is capped at 4 hours.
# See docs/AWS.md for the one-time setup (bootstrap, role ARN, Neon secrets, environment, public packages).
on:
  workflow_dispatch:
    inputs:
      ttl_hours:
        description: "Session lifetime in hours (1 to 4). Everything is destroyed at the end, and the reaper destroys it at this deadline at the latest."
        type: choice
        options: ["1", "2", "3", "4"]
        default: "2"
      confirm:
        description: "Type exactly: CREATE EKS SESSION"
        type: string
        required: true
      try_gvisor:
        description: "Optional, best effort: install gVisor on the sandbox nodes and rerun the attack suite and benchmark under it."
        type: boolean
        default: false
permissions:
  id-token: write   # OIDC to AWS
  contents: write   # commit the results file
  issues: write     # report orphans
concurrency:
  group: eks-session
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: ksc-session
  TERRAFORM_DIR: infra/eks

jobs:
  session:
    runs-on: ubuntu-24.04
    environment: eks-session   # requires the owner's approval
    timeout-minutes: 300
    steps:
      - name: Validate the request
        run: |
          [ "$CONFIRM" = "CREATE EKS SESSION" ] || { echo "confirmation string does not match"; exit 1; }
          case "$TTL_HOURS" in 1|2|3|4) ;; *) echo "ttl_hours must be 1 to 4"; exit 1;; esac
          for v in AWS_ROLE_ARN TF_STATE_BUCKET; do
            [ -n "${!v:-}" ] || { echo "repository variable $v is not set (docs/AWS.md)"; exit 1; }
          done
        env:
          CONFIRM: ${{ inputs.confirm }}
          TTL_HOURS: ${{ inputs.ttl_hours }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Assume the AWS role (OIDC, no stored keys)
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400

      - name: Cost estimate for this session
        env:
          TTL_HOURS: ${{ inputs.ttl_hours }}
        run: python3 scripts/cost_estimate.py "$TTL_HOURS"

      - name: The Kubernetes version must still be in standard support (live EKS API)
        run: |
          python3 scripts/check-eks-version.py
          v="$(sed -n 's/.*default *= *"\(1\.[0-9]*\)".*/\1/p' infra/eks/variables.tf | head -1)"
          read -r status end < <(aws eks describe-cluster-versions --cluster-versions "$v" \
            --query 'clusterVersions[0].[versionStatus,endOfStandardSupportDate]' --output text)
          echo "EKS $v: status=$status end_of_standard_support=$end"
          [ "$status" = "STANDARD_SUPPORT" ] || { echo "EKS $v is not in standard support: extended support costs 6x"; exit 1; }
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          [ "$days" -gt 60 ] || { echo "EKS $v leaves standard support in $days days"; exit 1; }

      - name: The images for this commit must exist and be public
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for img in ksc-api ksc-runner-python ksc-runner-node; do
            docker buildx imagetools inspect "ghcr.io/$owner/$img:sha-${GITHUB_SHA}" >/dev/null \
              || { echo "ghcr.io/$owner/$img:sha-${GITHUB_SHA} not found or private: run the images workflow and make the packages public"; exit 1; }
          done

      - name: Terraform init
        id: init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Session parameters (expiry tag and the runner's address)
        id: params
        env:
          TTL_HOURS: ${{ inputs.ttl_hours }}
        run: |
          echo "expires_at=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "runner_cidr=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')/32" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (creates the cluster)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="expires_at=${{ steps.params.outputs.expires_at }}" \
            -var="runner_cidr=${{ steps.params.outputs.runner_cidr }}"

      - name: Connect, install KEDA, create the Neon secret, install the chart
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: |
          [ -n "$NEON_DATABASE_URL" ] && [ -n "$NEON_DATABASE_URL_DIRECT" ] || { echo "Neon secrets are not set (docs/AWS.md)"; exit 1; }
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          helm repo add kedacore https://kedacore.github.io/charts
          helm upgrade --install keda kedacore/keda --version 2.21.0 -n keda --create-namespace --set webhooks.enabled=false --wait --timeout 10m
          kubectl create namespace ksc-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n ksc-system create secret generic ksc-neon \
            --from-literal=DATABASE_URL="$NEON_DATABASE_URL" \
            --from-literal=KEDA_CONNECTION="$NEON_DATABASE_URL_DIRECT" \
            --dry-run=client -o yaml | kubectl apply -f -
          owner="${GITHUB_REPOSITORY_OWNER,,}"; tag="sha-${GITHUB_SHA}"
          helm upgrade --install ksc charts/ksc -n ksc-system -f charts/ksc/values-eks.yaml \
            --set image.api="ghcr.io/$owner/ksc-api:$tag" \
            --set image.runnerPython="ghcr.io/$owner/ksc-runner-python:$tag" \
            --set image.runnerNode="ghcr.io/$owner/ksc-runner-node:$tag" \
            --wait --timeout 10m
          kubectl -n ksc-system rollout status deploy/ksc-api deploy/ksc-dispatcher --timeout=300s

      # The first test. If NetworkPolicy is not enforced on this cluster, nothing else is meaningful.
      - name: NetworkPolicy is enforced on this cluster (stops the session if not)
        env: {KSC_ENV: eks, WORKERS: "2"}
        run: make verify-cluster

      - name: e2e
        env: {KSC_ENV: eks}
        run: set -o pipefail; make e2e 2>&1 | tee e2e.log
      - name: Attack suite (includes the EKS-only instance-metadata test)
        env: {KSC_ENV: eks}
        run: set -o pipefail; make attack 2>&1 | tee attack.log
      - name: Chaos tests
        env: {KSC_ENV: eks}
        run: set -o pipefail; make chaos 2>&1 | tee chaos.log
      - name: Benchmark
        env: {BENCH_ENV: eks-t3-medium}
        run: set -o pipefail; uv run python bench/bench.py --runs 200 --concurrency 5 20 2>&1 | tee bench.log

      - name: gVisor (optional, best effort; the outcome is recorded either way)
        if: inputs.try_gvisor
        continue-on-error: true
        env: {KSC_ENV: eks}
        run: |
          set -o pipefail
          bash deploy/eks/gvisor.sh 2>&1 | tee gvisor.log

      - name: Commit the results file
        if: always() && steps.aws.outcome == 'success'
        run: |
          shopt -s nullglob
          files=(bench/results/*-eks-*.json)
          [ ${#files[@]} -gt 0 ] || { echo "no EKS results file to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --quiet || { git commit -m "bench: EKS session results"; git pull --rebase origin main && git push origin HEAD:main; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eks-session-logs
          path: |
            *.log
            bench/results/*-eks-*.json
          if-no-files-found: ignore

      # ---- Always runs: tear everything down, then prove nothing is left.
      # Credentials last 4 hours; a long session could have expired them by now, so take fresh ones.
      - name: Fresh AWS credentials for the teardown
        id: aws2
        if: always() && steps.aws.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success' && steps.aws2.outcome == 'success'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          for attempt in 1 2 3; do
            terraform destroy -input=false -auto-approve \
              -var="expires_at=${{ steps.params.outputs.expires_at }}" \
              -var="runner_cidr=${{ steps.params.outputs.runner_cidr }}" && exit 0
            echo "destroy attempt $attempt failed; retrying in 60 s"; sleep 60
          done
          exit 1

      - name: Verify that nothing tagged project=ksc remains
        id: orphans
        if: always() && steps.aws2.outcome == 'success'
        run: |
          sleep 30   # tag index lag
          bash scripts/aws_orphans.sh list | tee orphans.txt

      - name: Open an issue if anything was left behind
        if: always() && steps.orphans.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "EKS session left resources behind" \
            --label bug --body "$(printf 'The post-destroy check found resources tagged project=ksc. They bill until deleted.\n\nRun: %s\n\n```\n%s\n```\n\nThe aws-reaper workflow will also try to destroy them.' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(sed -E 's/[0-9]{12}/<account>/g' orphans.txt)")"
