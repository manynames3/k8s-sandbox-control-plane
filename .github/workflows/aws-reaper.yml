name: aws-reaper
# Independent backstop for the session workflow. Every hour: if anything tagged project=ksc is past its
# expires-at (or has no expires-at at all), or direct service queries find session resources, destroy the stack and open an issue. NOTE: GitHub pauses scheduled workflows in repositories that
# have been inactive for 60 days, so this is not the last line of defence: the AWS Budgets alerts ($5, $15, $25)
# created by infra/bootstrap are. Read docs/AWS.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  issues: write
concurrency:
  group: eks-session   # never runs at the same time as a session
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  reap:
    runs-on: ubuntu-24.04
    steps:
      - name: Is AWS configured? (the reaper does nothing before the owner has applied the bootstrap)
        id: configured
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "AWS_ROLE_ARN / TF_STATE_BUCKET not set: nothing to reap"; fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.yes == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.configured.outputs.yes == 'true'
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Assume the AWS role (OIDC)
        if: steps.configured.outputs.yes == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Anything past its expiry?
        id: expired
        if: steps.configured.outputs.yes == 'true'
        run: |
          set +e
          # Tag-based (expired or no deadline) and direct (no tags needed). Direct queries cannot tell an expired
          # session from a live one, but the concurrency group guarantees no session is running while this job runs.
          bash scripts/aws_orphans.sh expired 2>&1 | tee expired.txt;  r1=${PIPESTATUS[0]}
          bash scripts/aws_orphans.sh deep 2>&1 | tee -a expired.txt;  r2=${PIPESTATUS[0]}
          # 1 = found (reap); 2 = a check itself failed: fail the run but destroy only if the other check found something
          if [ "$r1" = 1 ] || [ "$r2" = 1 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$r1" = 2 ] || [ "$r2" = 2 ]; then exit 2; fi
          exit 0

      - name: Destroy the stack
        id: destroy
        if: steps.expired.outputs.found == 'true'
        working-directory: infra/eks
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform destroy -input=false -auto-approve -lock-timeout=5m -var="expires_at=reaped" -var="runner_cidr=127.0.0.1/32"

      - name: Fallback - delete directly, then destroy again
        id: fallback
        if: always() && steps.expired.outputs.found == 'true' && steps.destroy.outcome != 'success'
        run: |
          bash scripts/aws_force_cleanup.sh --yes || echo "direct cleanup reported failures"
          cd infra/eks
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform destroy -input=false -auto-approve -lock=false -var="expires_at=reaped" -var="runner_cidr=127.0.0.1/32"

      - name: Anything still left after the destroy?
        id: after
        if: steps.expired.outputs.found == 'true'
        run: |
          set +e; sleep 30
          bash scripts/aws_orphans.sh list 2>&1 | tee after.txt;  r1=${PIPESTATUS[0]}
          bash scripts/aws_orphans.sh deep 2>&1 | tee -a after.txt; r2=${PIPESTATUS[0]}
          exit $(( r1 > r2 ? r1 : r2 ))

      - name: Open an issue
        if: steps.expired.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left="$( [ -f after.txt ] && cat after.txt || echo 'unknown' )"
          gh issue create --title "aws-reaper found expired resources" --label bug \
            --body "$(printf 'Resources tagged project=ksc were past their expires-at.\n\nExpired:\n```\n%s\n```\n\nDestroy outcome: %s\nStill present afterwards:\n```\n%s\n```\nRun: %s' "$(sed -E 's/[0-9]{12}/<account>/g' expired.txt)" "${{ steps.destroy.outcome }}" "$(printf '%s' "$left" | sed -E 's/[0-9]{12}/<account>/g')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
